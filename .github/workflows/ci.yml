name: Build and scan
on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create the empty environment file
        run: touch .env

      - name: Build the application
        uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: |
            cd button-app
            idf.py build

      - name: Scan the image
        uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: |
            cd button-app
            set -o pipefail
            strings build/button-app.bin \
              | gitleaks stdin --config ../.gitleaks.toml -v --no-banner \
                  --report-format json --report-path ../firmware-scan.json

      - name: Upload the firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            button-app/build/button-app.bin
          if-no-files-found: error

      - name: Upload the scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-report
          path: firmware-scan.json
          if-no-files-found: warn
