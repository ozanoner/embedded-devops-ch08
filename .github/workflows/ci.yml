name: Build and scan
on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.4.0

      - name: Create the empty environment file
        run: touch .env

      - name: Build the application
        uses: devcontainers/ci@v0.3.1900000450
        with:
          push: never
          runCmd: |
            cd button-app
            idf.py build

      - name: Scan the image
        uses: devcontainers/ci@v0.3.1900000450
        with:
          push: never
          runCmd: |
            cd button-app
            set -o pipefail
            strings build/button-app.bin \
              | gitleaks stdin --config ../.gitleaks.toml -v --no-banner \
                  --report-format json --report-path ../firmware-scan.json

      - name: Attest the firmware
        uses: actions/attest-build-provenance@v2.4.0
        with:
          subject-path: button-app/build/button-app.bin

      - name: Upload the firmware
        if: success()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: firmware
          path: |
            button-app/build/button-app.bin
          if-no-files-found: error

      - name: Upload the scan report
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: scan-report
          path: firmware-scan.json
          if-no-files-found: warn
