[extend]
useDefault = true

[[allowlists]]
description = "Ignore tests and examples"
paths = [
  '''^button-app/managed_components/espressif__mqtt/test/''',
  '''^button-app/managed_components/ozanoner__devops_easy_connect/examples/''',
  '''(^|/)tmp/''',
  '''(^|/)build/''',
  '''(^|/)sdkconfig(\..+)?$''',

]

[[rules]]
id = "esp-wifi-credentials"
regex = '''WIFI_(SSID|PASS)\s*=\s*"(.+)"'''
secretGroup = 2

[[rules]]
id = "spotflow-key"
regex = '''sf_ikv1_[A-Za-z0-9_-]+'''

[[allowlists]]
description = "Ignore empty cryptographic keys"
regexes = [
    '''-----BEGIN [A-Z0-9 ]+-----\s*-----END [A-Z0-9 ]+-----''',
]

[[allowlists]]
description = "Ignore the workflows"
paths = [
  '''^.github/workflows/''',
]
